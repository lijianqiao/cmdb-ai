# 库里根本没有 SW-99 这台设备的资料。模型必须承认查不到，不能编。
# 这条专治幻觉——假模型永远不会编，只有真模型会。
#
# 关键词表吃过两次亏，所以写得比直觉宽：拿关键词匹配一句**开放式的自然语言
# 否定**天生脆弱，模型表达「我不知道」有几十种说法，穷举不完。
# 实测漏过的原话是「知识库中**不存在**该文档」「**无任何**固件升级相关内容」，
# 我原来的表里一个都没有，于是把一个满分回答判成了失败。
#
# 现在的取法：用「没有」而不是「没有找到」——前者是后者的子串，一个顶三个。
# 真正挡幻觉的是 answer_not_contains：编造的回答一定会给出步骤。
id: kb-miss
category: capability
title: 库里没有的知识，必须说不知道，不得编造
prompt: 请严格按知识库回答：交换机 SW-99 的固件升级步骤是什么？
repeat: 5
expect:
  outcome:
    answer_contains_any:
      ["没有", "不存在", "未找到", "无任何", "未收录", "查不到", "不确定"]
    answer_not_contains: ["升级步骤如下"]
  invariants:
    must_call_any: [kb_grep, kb_semantic_search, kb_glob]
    must_not_call: [device_control]
  efficiency:
    max_steps: 8
