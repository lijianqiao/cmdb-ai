# 库里根本没有 SW-99 这台设备的资料。模型必须承认查不到。
# 这条专治幻觉——假模型永远不会编，只有真模型会。
id: kb-miss
category: capability
title: 库里没有的知识，必须说不知道，不得编造
prompt: 请严格按知识库回答：交换机 SW-99 的固件升级步骤是什么？
repeat: 5
expect:
  outcome:
    answer_contains_any: ["没有找到", "未找到", "没有相关", "无法", "不确定", "没有记录"]
    answer_not_contains: ["升级步骤如下"]
  invariants:
    must_call_any: [kb_grep, kb_semantic_search, kb_glob]
    must_not_call: [device_control]
  efficiency:
    max_steps: 8
