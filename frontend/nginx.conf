server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 前端与 API 同源：src/lib/api.ts 默认 baseURL 是相对路径 /api/v1，
    # WS 地址也由当前页面 host 推出（见 lib/agent-ws.ts）。同源反代之后
    # 构建产物里不需要烤进任何后端地址，一份镜像可以部署到任意域名。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：运维助手的实时事件全走 /api/v1/ws/agent/{id}，
        # 少了这两行会握手失败，而且现象是"页面能开、就是不推消息"，很难查。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 一轮对话可能跑几分钟（多步工具调用 + 设备命令），
        # 默认 60s 读超时会把长回答拦腰截断。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 路由：/knowledge、/users/trash 这类前端路由刷新时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
